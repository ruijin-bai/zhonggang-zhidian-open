services:
  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zhidian_team
      POSTGRES_USER: zhidian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run team Init first}
    ports:
      - "127.0.0.1:${TEAM_DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhidian -d zhidian_team"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
